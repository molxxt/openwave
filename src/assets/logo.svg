<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Biohazard mark, lavender on transparent — vector recreation -->
  <g stroke="#a5a6f6" fill="none">
    <!-- outer broken ring (the three horns) -->
    <circle cx="50" cy="50" r="28" stroke-width="13"
            stroke-dasharray="48.643 10"
            transform="rotate(160.15 50 50)"/>
    <!-- inner broken ring -->
    <circle cx="50" cy="50" r="11" stroke-width="6.5"
            stroke-dasharray="16.038 7"
            transform="rotate(168.07 50 50)"/>
  </g>
  <!-- center dot -->
  <circle cx="50" cy="50" r="4.6" fill="#a5a6f6"/>
</svg>
