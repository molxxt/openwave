name: Build OpenWave

# Runs on every version tag (v0.7.0, ...) and lets you trigger it manually.
# Builds Linux (AppImage + tarball) and Windows (portable exe + installer), then
# attaches all of them to a draft release you can review and publish.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download yt-dlp binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p build
          curl -fL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o build/yt-dlp-linux
          chmod +x build/yt-dlp-linux

      - name: Download yt-dlp binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "build/yt-dlp.exe"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run dist -- --publish never

      - name: Upload Linux build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWave-Linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload Windows build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWave-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

  # collect both platforms' artifacts and attach them to a draft release;
  # open the release on GitHub, check it, then hit publish
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
